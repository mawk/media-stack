server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Paired with the $upstream_* variables below, this makes nginx
    # resolve each proxy_pass hostname lazily per-request instead of once at config-load time.
    # Without this, a plain "proxy_pass http://jellyfin:8096;" is resolved ONCE at nginx
    # startup, and if that hostname doesn't resolve at that exact moment (upstream container
    # restarting, not up yet on a fresh `docker compose up`, host reboot race, ...) nginx
    # refuses to start AT ALL with "host not found in upstream" — taking down routing for
    # every service (radarr/sonarr/prowlarr too), not just the one that's actually down, and
    # crash-looping until the stars realign. With this, only requests to the down service 502;
    # everything else keeps working, and nginx itself never fails to start.
    resolver 127.0.0.11 valid=10s;

    # Radarr Routing
    location /radarr {
        set $upstream_radarr http://radarr:7878;
        proxy_pass $upstream_radarr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sonarr Routing
    location /sonarr {
        set $upstream_sonarr http://sonarr:8989;
        proxy_pass $upstream_sonarr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prowlarr Routing (Through VPN)
    location /prowlarr {
        set $upstream_vpn http://vpn:9696;
        proxy_pass $upstream_vpn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Automatically add the trailing slash to /jellyfin if it's missing
    location = /jellyfin {
        return 301 $scheme://$host$request_uri/;
    }

    # Your Jellyfin Routing block
    location /jellyfin/ {
        set $upstream_jellyfin http://jellyfin:8096; # Cleaned: No trailing slash or text path at the end
        proxy_pass $upstream_jellyfin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # Jellyfin WebSockets
    location /jellyfin/socket {
        set $upstream_jellyfin_ws http://jellyfin:8096; # Cleaned: No trailing slash or text path at the end
        proxy_pass $upstream_jellyfin_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
